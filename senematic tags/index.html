<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Semantic HTML</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Section -->
        <section>
            <h2>About Me</h2>
            <p>This is my first website.</p>
        </section>

        <!-- Article -->
        <article>
            <h2>My First Article</h2>
            <p>This is an article written using HTML.</p>
        </article>

    </main>

    <!-- Footer -->
    <footer>
        <p>Copyright © 2026</p>
    </footer>

</body>

</html>
