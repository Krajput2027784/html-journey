<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - let's learn it</title>
</head>
<body>
    <h1>Form to apply practicing HTml</h1>
    <Form action="post">
        <div>      
              <label for="username">Enter your username</label>
        <input type="text" name="username" id="enter you username">
         
        </div>

        <div>
      
  <input type="radio" id="male" name="gender" value="male">
  <label for="male">Male</label>
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label>   
  </div>

  <div>
     <input type="button" value="submit">
     <label for="submit">Submit the form</label>

  </div>
  <div>
    <label for="comment">Enter your comment</label> 
    <textarea name="Enter your comment" id="Comment" cols="30" rows="10"></textarea>
        
  </div>
     
    </Form>    
</body>
</html>
